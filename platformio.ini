; SkySentinel firmware: ONE image per board type. Whether a board is a standalone
; unit, the master, or a node is a setting saved on the board (first-run setup in
; the web UI, or the "role" serial command), so changing it never needs a reflash.
;
;   pio run -e c5 -t upload       any ESP32-C5 board (DevKitC-1, Marauder V8 radio)
;   pio run -e v8 -t upload       Marauder V8 (PSRAM; defaults to master)
;   pio run -e classic -t upload  original ESP32 (WROOM-32 DevKit): Classic Bluetooth node
;   pio run -e cyd -t upload      CYD (ESP32-2432S028 or ESP32-32E): Classic node + touch dashboard
;   pio run -e heltec -t upload   Heltec Wireless Tracker (ESP32-S3 + SX1262): LoRa node
;   make -C test/host             host unit tests for lib/sscore (no hardware needed)
;   python3 tools/test_ssproto.py Python decoder vs C++ encoder

[platformio]
default_envs = c5

; Settings shared by every environment below
[env]
; pioarduino = Arduino-ESP32 3.x with ESP32-C5 support
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c5-devkitc-1
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; One big app partition (no OTA slot): Wi-Fi + BLE + ESP-NOW is ~1.4 MB, more than
; the default 1.25 MB OTA layout allows on a 4 MB board.
board_build.partitions = huge_app.csv
; Builds webui/index.html into the firmware (served by the Wi-Fi access point)
extra_scripts = pre:tools/embed_webui.py
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.6
build_flags =
  -Ilib/sscore
  -Isrc/common
  -DCORE_DEBUG_LEVEL=1
  -DSS_FW_VERSION=0x0001
  ; Serial over the C5's native USB-Serial/JTAG port (the one that flashes without
  ; buttons). USB_MODE=1 selects HWCDC; the C5 has no USB-OTG for the TinyUSB stack.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:c5]
build_src_filter = +<common/> +<app/>
build_flags =
  ${env.build_flags}
  -DSS_HW_TYPE=HW_C5_DEVKIT
  -DBOARD_HAS_PSRAM
  -DSS_WIFI_TRIM
  -Wl,--wrap=esp_wifi_init

[env:v8]
build_src_filter = +<common/> +<app/>
build_flags =
  ${env.build_flags}
  -DSS_HW_TYPE=HW_MARAUDER_V8
  -DBOARD_HAS_PSRAM

; Original ESP32 (ESP32-WROOM-32/-32E DevKit, CYD): the only ESP32 with Classic
; Bluetooth. Always a node. Uses Espressif's Bluedroid stack (Classic), not NimBLE.
[env:classic]
board = esp32dev
build_src_filter = +<common/> +<classic/>
lib_deps =
lib_ignore = NimBLE-Arduino
monitor_dtr = 1
monitor_rts = 1
build_flags =
  -Ilib/sscore
  -Isrc/common
  -DCORE_DEBUG_LEVEL=1
  -DSS_FW_VERSION=0x0001
  -DSS_HW_TYPE=HW_ESP32_DEVKIT
  -Wl,--wrap=esp_wifi_init

; CYD: ESP32-2432S028 ("Cheap Yellow Display") or LCDWiki's 2.8" ESP32-32E. The Classic
; node above plus a touch dashboard of what the master sees (src/common/cyd_ui.*).
[env:cyd]
board = esp32dev
build_src_filter = +<common/> +<classic/>
lib_deps =
  adafruit/Adafruit ILI9341@^1.6.2
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
  adafruit/Adafruit GFX Library@^1.12.1
lib_ignore = NimBLE-Arduino
monitor_dtr = 1
monitor_rts = 1
build_flags =
  -Ilib/sscore
  -Isrc/common
  -DCORE_DEBUG_LEVEL=1
  -DSS_FW_VERSION=0x0001
  -DSS_HW_TYPE=HW_CYD
  -DSS_CYD
  -Wl,--wrap=esp_wifi_init

; Heltec Wireless Tracker (ESP32-S3, 8 MB flash, SX1262 LoRa, GNSS). Same firmware as
; the C5 (BLE + 2.4 GHz Wi-Fi, any role, defaults to node) plus a 915 MHz LoRa listener.
[env:heltec]
board = esp32-s3-devkitc-1
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.6
  jgromes/RadioLib@^7.8.1
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
  adafruit/Adafruit GFX Library@^1.12.1
build_src_filter = +<common/> +<app/>
build_flags =
  ${env.build_flags}
  -DSS_HW_TYPE=HW_HELTEC_TRACKER
  -DSS_LORA
  -DSS_DISPLAY_ST7735
  -DSS_HAS_DISPLAY
  -DSS_GPS

; LilyGO T-Embed CC1101 (ESP32-S3, 16 MB flash): the C5's firmware (BLE + 2.4 GHz Wi-Fi,
; defaults to node) plus a sub-GHz band watch on its CC1101 (315 / 345 / 390 / 433.92 /
; 915 MHz: bursts and jammers), its 1.9" screen and the jog wheel. Receive only.
[env:tembed]
board = esp32-s3-devkitc-1
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.6
  jgromes/RadioLib@^7.8.1
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
  adafruit/Adafruit GFX Library@^1.12.1
build_src_filter = +<common/> +<app/>
build_flags =
  ${env.build_flags}
  -DSS_HW_TYPE=HW_TEMBED_CC1101
  -DSS_SUBGHZ
  -DSS_DISPLAY_TEMBED
  -DSS_HAS_DISPLAY
